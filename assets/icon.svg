<!--
  Appikon: den svenska övningskörningsskylten, med "B-körkort" under, på en
  bakgrund som anspelar på det svenska körkortets guillochemönster.

  Skylten är reglerad i TSFS 2010:81: vit versaltext "ÖVNINGSKÖR" på grön
  botten, standardformat 460×100 mm. Grönt är privat övningskörning —
  trafikskolor använder röd botten, så kulören är inte utbytbar.

  Bakgrunden är en STILISERAD tolkning av körkortets blekrosa guilloche, inte
  en kopia. Det riktiga mönstret är avsiktligt intrikat eftersom det är ett
  förfalskningsskydd, och intrikat är fel i en ikon som ska läsas i 48 px.
  Här är linjerna få, mjuka och lågmälda — de ska ge en känsla av körkort på
  nära håll och läsas som en varm off-white på avstånd, aldrig konkurrera med
  skylten.

  Medvetet uteslutet: EU-flagga, myndighetslogotyp, rubriker och allt annat
  som skulle få ikonen att likna en handling snarare än en app.

  Genereras till PNG med: node scripts/generate-icons.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Övningskörning B</title>
  <desc>
    Den svenska övningskörningsskylten — vit text ÖVNINGSKÖR på grön botten —
    med texten B-körkort under, mot en blekrosa bakgrund i körkortets anda.
  </desc>

  <defs>
    <!-- Guillochemönstret. Två uppsättningar vågor i lätt olika frekvens
         ger den flätade karaktären utan att bli tätt brus. -->
    <pattern id="guilloche" width="128" height="64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e0c4cd" stroke-width="1.1" opacity="0.75">
        <path d="M -8 32 Q 24 6 56 32 T 120 32 T 184 32" />
        <path d="M -8 46 Q 24 20 56 46 T 120 46 T 184 46" />
        <path d="M -8 18 Q 24 -8 56 18 T 120 18 T 184 18" />
      </g>
      <g fill="none" stroke="#c8d8d4" stroke-width="0.9" opacity="0.6">
        <path d="M -8 32 Q 32 58 72 32 T 152 32" />
        <path d="M -8 8 Q 32 34 72 8 T 152 8" />
        <path d="M -8 56 Q 32 82 72 56 T 152 56" />
      </g>
    </pattern>
  </defs>

  <!-- Basen: nästan vit med varm rosa dragning, som kortets botten. -->
  <rect width="512" height="512" rx="112" fill="#faf5f6" />
  <rect width="512" height="512" rx="112" fill="url(#guilloche)" />

  <!-- Skylten. Bred som den riktiga, med tunn vit bård innanför kanten. -->
  <g>
    <rect x="36" y="150" width="440" height="132" rx="10" fill="#00843d" />
    <rect
      x="50"
      y="164"
      width="412"
      height="104"
      rx="5"
      fill="none"
      stroke="#ffffff"
      stroke-width="7"
    />
    <text
      x="256"
      y="217"
      fill="#ffffff"
      font-family="Arial Narrow, Arial, Helvetica, sans-serif"
      font-size="60"
      font-weight="700"
      letter-spacing="1.5"
      text-anchor="middle"
      dominant-baseline="central"
    >ÖVNINGSKÖR</text>
  </g>

  <text
    x="256"
    y="360"
    fill="#1e293b"
    font-family="Arial, Helvetica, sans-serif"
    font-size="76"
    font-weight="700"
    letter-spacing="-1"
    text-anchor="middle"
    dominant-baseline="central"
  >B-körkort</text>
</svg>

<!--
  Appikon: den svenska övningskörningsskylten.

  Skylten är reglerad i TSFS 2010:81 — vit text "ÖVNINGSKÖR" på grön botten,
  i tre tillåtna format. Här används varianten 350×170 mm med kapade hörn,
  eftersom dess proportioner (ungefär 2:1) är de som bäst ryms i en kvadrat.
  Den långsmala 460×100-varianten blir en tunn strimma i ikonstorlek.

  Ordet är avsiktligt återgivet på EN rad, som på den riktiga skylten. Att
  bryta det över två rader hade gjort texten läsbar i mindre storlekar, men
  skylten hade slutat vara skylten.

  Vid 48 px läses ikonen som "grön skylt med vit text" snarare än som ordet
  — vilket är precis så den riktiga skylten uppfattas på en bil framför dig.

  Detta är en avbildning i en app om övningskörning, inte en skylt att sätta
  på ett fordon. TSFS 2010:81 reglerar användningen på fordon, inte
  avbildningen.

  Genereras till PNG med: node scripts/generate-icons.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Övningskörning</title>
  <desc>Den svenska övningskörningsskylten: vit text ÖVNINGSKÖR på grön botten.</desc>

  <!-- Mörk bakgrund ur designsystemets primärskala, så att ikonen hör ihop
       med appens övriga uttryck och skyltens gröna får kontrast att vila mot. -->
  <rect width="512" height="512" rx="112" fill="#1e293b" />

  <!-- Skylten, 2:1, med kapade hörn enligt föreskriftens variant.
       Grön enligt skyltens kulör. -->
  <path
    d="M 56 156
       L 76 136
       L 436 136
       L 456 156
       L 456 356
       L 436 376
       L 76 376
       L 56 356
       Z"
    fill="#00843d"
  />

  <!-- Tunn ljus kant. Utan den flyter grönt ihop med mörk bakgrund på
       skärmar med låg ljusstyrka. -->
  <path
    d="M 56 156
       L 76 136
       L 436 136
       L 456 156
       L 456 356
       L 436 376
       L 76 376
       L 56 356
       Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <text
    x="256"
    y="256"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="0.5"
    text-anchor="middle"
    dominant-baseline="central"
  >ÖVNINGSKÖR</text>
</svg>
